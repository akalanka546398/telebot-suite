<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bot Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --bg:#0f1115; --panel:#171a21; --border:#2a2e38; --text:#e6e8ec; --muted:#9aa2b1; --accent:#5b8cff; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
    nav { display:flex; gap:4px; padding:16px 24px; border-bottom:1px solid var(--border); }
    nav a { color:var(--muted); text-decoration:none; padding:8px 14px; border-radius:8px; }
    nav a:hover, nav a.active { color:var(--text); background:var(--panel); }
    main { max-width:900px; margin:0 auto; padding:32px 24px; }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:16px; }
    .stats { display:flex; gap:16px; }
    .stat { flex:1; }
    .stat .num { font-size:28px; font-weight:600; }
    .stat .label { color:var(--muted); font-size:13px; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--border); font-size:14px; }
    th { color:var(--muted); font-weight:500; }
    input, textarea { width:100%; padding:10px; border-radius:8px; border:1px solid var(--border); background:#0f1115; color:var(--text); font-family:inherit; }
    textarea { min-height:120px; resize:vertical; }
    button { background:var(--accent); color:white; border:none; padding:10px 18px; border-radius:8px; cursor:pointer; font-size:14px; }
    button.secondary { background:transparent; border:1px solid var(--border); color:var(--text); }
    label { display:block; margin:14px 0 6px; color:var(--muted); font-size:13px; }
    .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; }
    .pill.sent { background:#1f3a24; color:#6fd080; }
    .pill.pending { background:#3a331f; color:#e0b45a; }
    .msg { padding:10px 12px; border-radius:10px; margin-bottom:8px; max-width:80%; }
    .msg.user { background:#20242e; }
    .msg.admin { background:#223055; margin-left:auto; }
    .ticket-row { display:block; padding:10px; border-radius:8px; }
    .ticket-row:hover { background:#1e222b; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <nav>
    <a href="/">Analytics</a>
    <a href="/compose">Broadcast</a>
    <a href="/support">Support</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
